<text x="110" y="464" fill="#8b949e" font-family="monospace" font-size="13">isotropic-hyperfine control = 2.00e-15 &#183; polarity residual = 3.33e-15</text>
<text x="110" y="486" fill="#8b949e" font-family="monospace" font-size="13">closed form vs Liouvillian = 2.22e-16 (dim 12) &#183; spin-free partner 8.2&#215; stronger (tensor-dependent)</text>
