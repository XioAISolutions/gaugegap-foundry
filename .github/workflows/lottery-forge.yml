name: Lottery Forge

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/gaugegap/lottery_forge.py'
      - 'src/gaugegap/lottery_sources.py'
      - 'scripts/run_lottery_forge.py'
      - 'scripts/verify_lottery_proofpack.py'
      - 'tests/test_lottery_forge.py'
      - 'tests/test_lottery_sources.py'
      - 'config/foundry.d/lottery_forge.yaml'
      - 'data/lottery/**'
      - '.github/workflows/lottery-forge.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/gaugegap/lottery_forge.py'
      - 'src/gaugegap/lottery_sources.py'
      - 'scripts/run_lottery_forge.py'
      - 'scripts/verify_lottery_proofpack.py'
      - 'tests/test_lottery_forge.py'
      - 'tests/test_lottery_sources.py'
      - 'config/foundry.d/lottery_forge.yaml'
      - 'data/lottery/**'
      - '.github/workflows/lottery-forge.yml'
      - 'pyproject.toml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lottery Forge tests
        run: |
          python -m pytest -q tests/test_lottery_forge.py tests/test_lottery_sources.py
          foundry run lottery-forge-smoke
          python scripts/verify_lottery_proofpack.py /tmp/lottery-forge-smoke/proofpack.json

  official-wclc-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run official two-year WCLC experiment
        run: |
          python scripts/run_lottery_forge.py \
            --wclc-live \
            --years 2 \
            --null-trials 2000 \
            --dmd-trials 64 \
            --candidate-samples 100000 \
            --windows 26,52,104 \
            --compare 32,37,41,43,47,49 \
            --output-dir /tmp/lottery-forge-649
          python scripts/verify_lottery_proofpack.py /tmp/lottery-forge-649/proofpack.json
          cat /tmp/lottery-forge-649/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: lottery-forge-649-proofpack
          path: /tmp/lottery-forge-649/
