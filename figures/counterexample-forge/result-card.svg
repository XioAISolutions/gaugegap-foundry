<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Counterexample Forge structured reconstruction result</title>
  <desc id="desc">GaugeGap Foundry searched sixteen exact parameter values inside a declared sparse ansatz. One candidate survived, recovering coefficients 4, 3, 3, 2, negative 3, with Jacobian determinant negative 2 and exact common image negative one quarter, zero, zero. Labelled rediscovered within an ansatz.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#101a31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d7ff"/>
      <stop offset="1" stop-color="#8c7cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="210" fill="#35d7ff" opacity="0.055"/>
  <circle cx="80" cy="660" r="250" fill="#8c7cff" opacity="0.055"/>
  <rect x="58" y="50" width="1084" height="575" rx="28" fill="none" stroke="#93a9c7" stroke-opacity="0.22"/>

  <text x="92" y="112" fill="#8ea7c6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">GAUGEGAP FOUNDRY</text>
  <text x="92" y="175" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Counterexample Forge</text>
  <text x="92" y="218" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">STRUCTURED EXACT RECONSTRUCTION</text>

  <g transform="translate(92 266)">
    <rect width="300" height="126" rx="20" fill="#0c2132" stroke="#35d7ff" stroke-opacity="0.48"/>
    <text x="28" y="43" fill="#8ea7c6" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">EXACT VALUES SEARCHED</text>
    <text x="28" y="99" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">16</text>
  </g>

  <g transform="translate(422 266)">
    <rect width="300" height="126" rx="20" fill="#161b36" stroke="#8c7cff" stroke-opacity="0.55"/>
    <text x="28" y="43" fill="#9fa5c8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">SURVIVORS</text>
    <text x="28" y="99" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">1</text>
  </g>

  <g transform="translate(752 266)">
    <rect width="356" height="126" rx="20" fill="#0f2630" stroke="#64f5bb" stroke-opacity="0.46"/>
    <text x="28" y="43" fill="#9bc7ba" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">EXACT JACOBIAN</text>
    <text x="28" y="99" fill="#ffffff" font-family="Georgia, serif" font-size="50" font-weight="700">det(JF) = −2</text>
  </g>

  <text x="92" y="455" fill="#8ea7c6" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">RECOVERED COEFFICIENTS</text>
  <text x="92" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="42" font-weight="700">(a, b, c, d, e) = (4, 3, 3, 2, −3)</text>
  <text x="92" y="558" fill="#b7c9df" font-family="Georgia, serif" font-size="31">exact common image = (−1/4, 0, 0)</text>

  <g transform="translate(812 526)">
    <rect width="296" height="58" rx="29" fill="url(#accent)" opacity="0.95" filter="url(#glow)"/>
    <text x="148" y="37" text-anchor="middle" fill="#06111d" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.2">REDISCOVERED IN ANSATZ</text>
  </g>

  <text x="92" y="601" fill="#637d9e" font-family="Inter, Arial, sans-serif" font-size="16">Exact rational gates • deterministic hashes • public proofpack • not a novelty claim</text>
</svg>
