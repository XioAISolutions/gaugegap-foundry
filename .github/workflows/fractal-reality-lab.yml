name: Fractal Reality Lab

on:
  workflow_dispatch:
  push:
    paths:
      - "src/gaugegap/fractal_reality.py"
      - "scripts/run_fractal_reality_lab.py"
      - "scripts/check_fractal_reality_site.py"
      - "site/fractal-reality-lab/**"
      - "config/foundry.d/fractal_reality.yaml"
      - "tests/test_fractal_reality.py"
      - ".github/workflows/fractal-reality-lab.yml"
  pull_request:
    paths:
      - "src/gaugegap/fractal_reality.py"
      - "scripts/run_fractal_reality_lab.py"
      - "scripts/check_fractal_reality_site.py"
      - "site/fractal-reality-lab/**"
      - "config/foundry.d/fractal_reality.yaml"
      - "tests/test_fractal_reality.py"
      - ".github/workflows/fractal-reality-lab.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Focused scientific tests
        run: python -m pytest tests/test_fractal_reality.py
      - name: Generate deterministic smoke artifacts
        run: foundry run fractal-reality-smoke
      - name: Validate browser and evidence bundle
        run: |
          node --check site/fractal-reality-lab/app.js
          python scripts/check_fractal_reality_site.py
      - name: Verify BrainSNN handoff
        run: |
          foundry run brainsnn-showcase
          test -s site/brainsnn-gaugegap-showcase/showcase.json
          grep -q 'featured_experience' site/brainsnn-gaugegap-showcase/showcase.json
