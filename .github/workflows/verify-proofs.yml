name: Verify Proofs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[spectral,dev]'
      - name: Unit tests
        run: |
          mkdir -p /tmp/test-diagnostics
          set +e
          foundry run tests > /tmp/test-diagnostics/unit-tests.log 2>&1
          status=$?
          tail -n 200 /tmp/test-diagnostics/unit-tests.log
          exit $status
      - name: Upload unit-test diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-diagnostics
          path: /tmp/test-diagnostics/
          retention-days: 7
      - name: Reproduce canonical finite CurveRank screen
        run: foundry run curverank-proof-reproduction
      - name: Check certified mismatch floor
        run: python scripts/check_curverank_reproduction.py /tmp/verify-proof 27.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: /tmp/verify-proof/
          retention-days: 7

  smt-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SMT backend
        run: python -m pip install -e '.[smt]'
      - name: Verify registered inequality schemas
        run: foundry run verify-certificates

  compile-coq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile emitted Coq certificates
        run: foundry run compile-coq

  compile-lean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the branch tip rather than the default merge commit, so the
      # verified report can be committed back to the branch it describes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build the Lean Anomaly Forge
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "formal/lean"
          build: true
          test: false
          use-mathlib-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Require a real kernel check
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python scripts/run_lean_forge.py --require-verified
          python scripts/generate_dag_viz.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-forge-report
          path: results/lean-forge/
          retention-days: 7
      # The report and figure record what the Lean kernel accepted, so the
      # copies in the repository should be the ones a real `lake build`
      # produced rather than whatever a toolchain-less environment could
      # generate. This step only ever runs after --require-verified passed.
      # Both files are deterministic, so a rerun finds nothing to commit and
      # the loop terminates after one push.
      - name: Commit the verified report and figure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- results/lean-forge figures/anomaly-forge/lean-dag.svg; then
            echo "verified report and figure already committed; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lean-forge figures/anomaly-forge/lean-dag.svg
          git commit \
            -m "Record the verified Lean forge report and DAG figure" \
            -m "Written by the compile-lean job after lake build accepted every node, so the checked-in evidence is what the kernel produced rather than what a toolchain-less environment could generate."
          git push origin "HEAD:${{ github.head_ref }}"

  hard-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Claim and maturity audits
        run: foundry audit
      - name: Verify AGENTS.md boundary section
        run: |
          test -f AGENTS.md
          grep -q "Claim boundary" AGENTS.md

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Verify deterministic proofpack
        run: foundry run proofpack-verify
      - name: Build reviewer packet
        run: foundry run reviewer-packet
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-packet
          path: results/reviewer-packet
          if-no-files-found: error
