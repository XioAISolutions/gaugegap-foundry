name: Deploy GaugeGap Foundry

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/gaugegap/fractal_reality.py"
      - "scripts/run_fractal_reality_lab.py"
      - "scripts/check_fractal_reality_site.py"
      - "scripts/export_brainsnn_showcase.py"
      - "config/foundry.d/fractal_reality.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry
        run: python -m pip install -e '.[dev]'

      - name: Generate deterministic Fractal Reality artifacts
        run: |
          foundry run fractal-reality-lab
          foundry run fractal-reality-release

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
