version: 1

units:
  counterexample-forge-0001-reconstruct:
    track: counterexample-forge
    hypothesis: counterexample-forge-0001
    status: experimental
    description: Recover the benchmark coefficient tuple from a declared sparse ansatz, exact constant-Jacobian reduction, and collision constraints.
    command:
      ["{python}", "scripts/run_counterexample_reconstruction.py",
       "--output-dir", "artifacts/counterexample-forge-0001-reconstruction",
       "--minimum", "-8",
       "--maximum", "8"]

  counterexample-forge-reconstruct-smoke:
    track: counterexample-forge
    hypothesis: counterexample-forge-0001
    status: experimental
    description: Deterministic CI reconstruction over the bounded exact parameter window.
    command:
      ["{python}", "scripts/run_counterexample_reconstruction.py",
       "--output-dir", "/tmp/counterexample-forge-reconstruction-smoke",
       "--minimum", "-5",
       "--maximum", "5"]

groups:
  counterexample-forge-reconstruction:
    - counterexample-forge-0001-reconstruct

  counterexample-forge-reconstruction-release:
    - counterexample-forge-reconstruct-smoke
