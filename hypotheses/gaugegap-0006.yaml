id: gaugegap-0006
track: GaugeGap
model: su3_single_plaquette_character_basis
scope: exact single-plaquette SU(3) pure gauge theory in the irrep (character) basis
claim: >
  For a single plaquette, pure SU(3) gauge theory reduces exactly to quantum mechanics
  on the group manifold, and in the character basis of SU(3) irreps the Kogut-Susskind
  Hamiltonian H = (g^2/2) C2(p,q) - (1/(2 g^2))(M + M^T) is a real, Hermitian, sparse
  operator whose ground-state gap is positive, whose Wilson loop <(1/3) Re Tr U> grows
  monotonically toward weak coupling, whose spectrum is Gauss-law invariant by
  construction, and whose gap converges under truncation refinement (p + q <= Lambda).
prediction:
  observable: mass_gap
  expected_shape: positive_and_convergent_toward_strong_coupling_casimir
controls:
  coupling_range: [0.7, 5.0]
  truncation_cutoffs: [3, 5, 8]
  color_representation: fundamental
  fusion_rule: "(p,q) x (1,0) = (p+1,q) + (p-1,q+1) + (p,q-1)"
hamiltonian: H = g^2/2 C2(p,q) - 1/(2 g^2) (M + M^T)
validation:
  required:
    - fusion_dimension_identity_exact
    - hamiltonian_hermitian_and_real
    - strong_coupling_gap_approaches_casimir_of_fundamental
    - wilson_loop_monotone_and_bounded
    - gauss_law_by_construction
    - truncation_convergence
    - claim_boundary_certificate
kill_criteria:
  - mass gap becomes non-positive at any tested coupling
  - Hamiltonian is not real-symmetric in the character basis
  - fusion dimension identity 3 dim(p,q) = sum dim of (p,q) x (1,0) fails
  - Wilson loop leaves [0, 1] or is non-monotone in coupling
  - truncation refinement shows divergent gap
  - any certificate omits the single-plaquette SU(3) claim boundary
status: active
claim_boundary: >
  Exact finite truncation of the single-plaquette SU(3) Hamiltonian in the character
  basis only. It is a defensible toy and known-answer anchor for the SU(3)
  infrastructure - not a multi-plaquette lattice, not a continuum limit, and not a
  Yang-Mills mass-gap claim.
notes:
  - Supplies the exact SU(3) building block the multi-plaquette scaffold (gaugegap-0005)
    is missing - a genuinely gauge-invariant Hamiltonian with a real magnetic term.
  - Gauss law holds by construction; the character basis contains only invariant states.
  - No claim of Millennium Prize resolution - finite single-plaquette benchmark only.
