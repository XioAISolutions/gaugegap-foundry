name: Publish Foundry Experience to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/generate_foundry_experience*.py"
      - "config/foundry.d/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Generate the complete Foundry Experience
        run: |
          python scripts/generate_foundry_experience_complete.py \
            --output-dir site/foundry-experience \
            --preview figures/foundry-experience/preview.svg

      # `test -s index.html` only proved the file was not empty. A generator that
      # silently dropped scenes, or one that published without the claim
      # boundary, would still have passed and shipped. These assert what the page
      # is actually for.
      - name: Verify the bundle before publishing
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("site/foundry-experience")
          problems = []

          index = root / "index.html"
          data = root / "data.json"
          for required in (index, data):
              if not required.is_file() or required.stat().st_size == 0:
                  problems.append(f"missing or empty: {required}")

          if not problems:
              payload = json.loads(data.read_text())
              scenes = payload.get("scenes") or []
              # Fifteen scenes ship today. Assert the floor rather than the exact
              # count so adding one is not a build failure, but losing one is.
              if len(scenes) < 15:
                  problems.append(f"expected at least 15 scenes, generated {len(scenes)}")

              boundary = payload.get("claim_boundary") or ""
              if not boundary.strip():
                  problems.append("data.json carries no claim boundary")
              elif boundary not in index.read_text():
                  # The boundary is the honest part of this page. It must reach
                  # the published HTML, not just the dataset behind it.
                  problems.append("claim boundary is absent from the published index.html")

          if problems:
              print("Foundry Experience bundle failed verification:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)

          print(f"bundle verified: {len(scenes)} scenes, claim boundary present")
          PY
      - name: Add root redirect
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=foundry-experience/">
          <title>GaugeGap Foundry Experience</title>
          <a href="foundry-experience/">GaugeGap Foundry Experience</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
